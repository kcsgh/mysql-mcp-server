# Optional: lets Render create the service straight from this repo via
# "New +" -> "Blueprint". You can just as easily click "New Web Service"
# and point it at the repo manually -- see README.md.
services:
  - type: web
    name: mysql-mcp-server
    runtime: docker
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: AUTH_TOKEN
        sync: false
